services:
  - type: web
    name: exploreme-ai-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: RS VIBE CareerOS
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: API_V1_STR
        value: /api/v1
      - key: FRONTEND_URL
        value: https://rsvibecareer.rathenesh.dev
      - key: SECRET_KEY
        generateValue: true
      - key: MONGODB_URL
        sync: false
      - key: MONGODB_DB_NAME
        value: exploreme_ai_prod
      - key: GROQ_API_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
